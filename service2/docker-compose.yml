version: '3'

services:
  service2:
    build: .
    container_name: service2
    environment:
      - CELERY_BROKER_URL=amqp://user:password@rabbitmq:5672//
    networks:
      - my_network
  
  celery_worker_2:
    build: .
    container_name: celery_worker_2
    command: celery -A celery_worker worker --loglevel=info -Q service2_queue
    environment:
      - CELERY_BROKER_URL=amqp://user:password@rabbitmq:5672//
    networks:
      - my_network
    
networks:
  my_network:
    external: true